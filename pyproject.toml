[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-qq-bridge"
version = "2.3.0"
description = "Google AGY QQ Bridge - Connect AGY CLI to QQ instant messaging"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "httpx>=0.23.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
]

[project.scripts]
agy-qq-bridge = "agy_qq_bridge.bridge:cli"

[tool.hatch.build.targets.wheel]
packages = ["agy_qq_bridge"]
